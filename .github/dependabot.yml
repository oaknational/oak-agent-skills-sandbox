version: 2
# Armed for battle test D-01.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      oak-agent-skills:
        patterns:
          - "@oaknational/oak-agent-skills"
    # Must match minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
      exclude:
        - "@oaknational/oak-agent-skills"
    commit-message:
      prefix: chore
      include: scope
