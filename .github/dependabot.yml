version: 2
# Armed for battle tests D-03, B-01 and B-05, with one slot free.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      oak-agent-skills:
        patterns:
          - "@oaknational/oak-agent-skills"
    # Must match minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 7
      exclude:
        - "@oaknational/oak-agent-skills"
    commit-message:
      prefix: chore
      include: scope
