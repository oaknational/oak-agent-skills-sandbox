version: 2
# Armed for battle test D-05: the adapter's npm entry, with no group for the package.
updates:
  - package-ecosystem: npm
    # The workspace has one root lockfile; per-package entries would conflict
    # over it.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      exclude:
        - "@oaknational/*"
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
