# Battle test X-06, temporary. Lists every repository the oak-agent-skills App can reach with
# a token that isn't limited to one repository, which is what a leaked key could reach.
#
# It runs only on Dependabot's pull requests, because only those runs can read the
# organisation Dependabot secrets. The token is read-only (metadata). Public repositories are
# named; any other is counted without its name, because this repository's logs are public.
# Remove this file straight after one run.
name: battle X-06 App reach

on:
  pull_request:

permissions: {}

concurrency:
  group: battle-app-reach-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reach:
    name: List the App's repositories
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]' # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OAK_SKILLS_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.OAK_SKILLS_APP_KEY }} # zizmor: ignore[secrets-outside-env]
          # Unscoped on purpose: the test measures what a leaked key could reach.
          owner: oaknational # zizmor: ignore[github-app]
          permission-metadata: read
      - name: List what the token reaches
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          echo "Repositories the installation reaches: $(gh api /installation/repositories --jq .total_count)"
          gh api /installation/repositories --paginate \
            --jq '.repositories[] | if .visibility == "public" then .full_name else "(\(.visibility), name withheld)" end' |
            sort | uniq -c
